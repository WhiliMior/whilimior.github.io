name: Hugo Build and Deploy

on:
  # 在目标为默认分支的推送上运行
  push:
    branches:
      - main
  # 允许手动从"Actions"标签运行此工作流程
  workflow_dispatch:

# 设置GITHUB_TOKEN的权限，以允许部署到GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 仅允许一个并发部署，跳过在进行中的运行与最新排队的运行之间排队的运行
# 但是不要取消进行中的运行，因为我们希望这些生产部署能够完成
concurrency:
  group: "pages"
  cancel-in-progress: false

# 默认使用bash
defaults:
  run:
    shell: bash

jobs:
  # 构建作业
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 递归检出子模块（主题）
          fetch-depth: 0        # 获取完整Git历史，用于显示最后更新时间

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装并校验 Hugo Extended
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/install-hugo.mjs

      - name: 验证图片发布策略检查器
        run: node --test scripts/verify-site.test.mjs

      - name: 验证 Cat Atlas 发布检查器
        run: node --test scripts/verify-catatlas.test.mjs

      - name: 设置Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: 使用Hugo构建
        env:
          # 为了与Hugo模块的最大向后兼容性
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 渲染项目页并生成搜索索引
        run: |
          npm ci
          npm run render:cat-atlas
          npm run search:index

      - name: 验证网页和图片资源
        run: node scripts/verify-site.mjs --public public --content content

      - name: 验证 Cat Atlas 图片、动画、视频和下载
        run: node scripts/verify-catatlas.mjs --public public

      - name: 上传构建产物
        # content/ is the publication copy prepared by private blog-content policies.
        # Watermarks are opt-in per folder; private credentials/configuration stay private.
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 部署作业
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
