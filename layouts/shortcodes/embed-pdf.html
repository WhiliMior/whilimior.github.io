{{- $pdf := .Get "url" | relURL -}}
{{- $viewer := printf "%s?file=%s#zoom=page-width" ("pdfjs/web/viewer.html" | relURL) ($pdf | urlquery) -}}
{{- $zh := eq .Page.Language.Lang "zh-cn" -}}
<figure class="pdf-reader" style="margin:1.5rem 0">
  <figcaption style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem">
    <a href="{{ $viewer }}" target="_blank" rel="noopener">{{ if $zh }}展开阅读{{ else }}Open full reader{{ end }}</a>
    <a href="{{ $pdf }}" target="_blank" rel="noopener">{{ if $zh }}打开原始 PDF{{ else }}Open original PDF{{ end }}</a>
    <a href="{{ $pdf }}" download>{{ if $zh }}下载 PDF{{ else }}Download PDF{{ end }}</a>
  </figcaption>
  <iframe src="{{ $viewer }}" title="{{ if $zh }}PDF 阅读器{{ else }}PDF reader{{ end }}" loading="lazy" allow="fullscreen" style="display:block;width:100%;height:80vh;height:80dvh;min-height:420px;border:1px solid #8886;border-radius:4px"></iframe>
</figure>
